<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Downloader - Designed by Talha Ansari</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-top: 40px; /* Spacing added for clean layout */
      margin-bottom: 30px;
    }
    .logo {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .designer-tag {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }
    .designer-name {
      color: #38bdf8;
      font-weight: 600;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: #1e293b;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid #334155;
    }
    .platform-icons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
      font-size: 1.8rem;
    }
    .platform-icons .fa-youtube { color: #ff0000; }
    .platform-icons .fa-tiktok { color: #00f2fe; }
    .platform-icons .fa-instagram { color: #e1306c; }
    
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (min-width: 480px) {
      .input-group {
        flex-direction: row;
      }
    }
    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s;
    }
    input[type="text"]:focus {
      border-color: #3b82f6;
    }
    button.btn-fetch {
      padding: 14px 24px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    button.btn-fetch:hover {
      opacity: 0.9;
    }
    .loader {
      display: none;
      text-align: center;
      margin: 20px 0;
      color: #94a3b8;
    }
    .loader i {
      font-size: 2rem;
      animation: spin 1s linear infinite;
      color: #38bdf8;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .result-card {
      display: none;
      margin-top: 20px;
      background: #0f172a;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #334155;
    }
    .video-thumb {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 15px;
      object-fit: cover;
      max-height: 280px;
    }
    .video-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 15px;
      color: #f1f5f9;
      line-height: 1.4;
      word-break: break-word;
    }
    .download-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .dl-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #22c55e;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .dl-btn:hover {
      background: #16a34a;
    }
    footer {
      margin-top: auto;
      padding: 20px;
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <i class="fa-solid fa-cloud-arrow-down"></i> Media Downloader
    </div>
    <div class="designer-tag">Designed by <span class="designer-name">Talha Ansari</span></div>
  </header>

  <div class="container">
    <div class="platform-icons">
      <i class="fa-brands fa-youtube" title="YouTube"></i>
      <i class="fa-brands fa-tiktok" title="TikTok"></i>
      <i class="fa-brands fa-instagram" title="Instagram"></i>
    </div>

    <div class="input-group">
      <input type="text" id="videoUrl" placeholder="Paste YouTube or TikTok link here..." />
      <button class="btn-fetch" onclick="fetchVideo()">
        <i class="fa-solid fa-magnifying-glass"></i> Fetch
      </button>
    </div>

    <div class="loader" id="loader">
      <i class="fa-solid fa-circle-notch"></i>
      <p style="margin-top: 10px;">Downloading media link...</p>
    </div>

    <div class="result-card" id="resultCard">
      <img id="thumbImg" class="video-thumb" src="" alt="Thumbnail" style="display:none;">
      <div class="video-title" id="videoTitle">Video Ready for Download</div>
      <div class="download-btns">
        <a id="downloadVideoBtn" class="dl-btn" href="#" target="_blank" rel="noopener noreferrer">
          <i class="fa-solid fa-download"></i> Download Video / Media
        </a>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2026 Media Downloader. Designed by Talha Ansari.
  </footer>

  <script>
    async function fetchVideo() {
      const url = document.getElementById('videoUrl').value.trim();
      const loader = document.getElementById('loader');
      const resultCard = document.getElementById('resultCard');
      const dlBtn = document.getElementById('downloadVideoBtn');
      const thumbImg = document.getElementById('thumbImg');
      const videoTitle = document.getElementById('videoTitle');

      if (!url) {
        alert('Please paste a valid link!');
        return;
      }

      loader.style.display = 'block';
      resultCard.style.display = 'none';

      // Primary API: Tikwm (For TikTok)
      if (url.includes('tiktok.com')) {
        try {
          const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
          const data = await res.json();
          loader.style.display = 'none';

          if (data && data.data) {
            videoTitle.innerText = data.data.title || 'TikTok Video (No Watermark)';
            if (data.data.cover) {
              thumbImg.src = data.data.cover;
              thumbImg.style.display = 'block';
            }
            dlBtn.href = data.data.play;
            resultCard.style.display = 'block';
            return;
          }
        } catch (e) {
          console.log('TikTok API 1 failed, trying fallback...');
        }
      }

      // Universal Fallback Download Engine
      try {
        const response = await fetch(`https://api.vkrdown.com/api/item?url=${encodeURIComponent(url)}`);
        const data = await response.json();
        loader.style.display = 'none';

        if (data && (data.url || (data.downloads && data.downloads.length > 0))) {
          const downloadUrl = data.url || data.downloads[0].url;
          videoTitle.innerText = data.title || 'Media File Ready';
          if (data.thumbnail) {
            thumbImg.src = data.thumbnail;
            thumbImg.style.display = 'block';
          }
          dlBtn.href = downloadUrl;
          resultCard.style.display = 'block';
        } else {
          // Direct Web Download Redirection Fallback
          loader.style.display = 'none';
          videoTitle.innerText = 'Click below to download media via high-speed server:';
          dlBtn.href = `https://ssstik.io/en`;
          if (url.includes('youtube.com') || url.includes('youtu.be')) {
            dlBtn.href = `https://y2mate.is/`;
          }
          resultCard.style.display = 'block';
        }
      } catch (error) {
        loader.style.display = 'none';
        // Emergency direct download fallback link
        videoTitle.innerText = 'Direct Server Link Ready';
        dlBtn.href = url.includes('tiktok') ? 'https://ssstik.io/' : 'https://y2mate.is/';
        resultCard.style.display = 'block';
      }
    }
  </script>
</body>
</html>
